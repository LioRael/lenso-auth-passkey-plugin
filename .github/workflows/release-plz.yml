name: Release-plz

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable commit SHA to validate (must be supplied explicitly)
        required: true
        type: string

permissions: {}

concurrency:
  group: passkey-crates-release-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Release dry-run
    if: ${{ github.repository == 'LioRael/lenso-auth-passkey-plugin' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Validate immutable SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          case "$COMMIT_SHA" in
            ""|*[!0-9a-fA-F]*) echo 'commit_sha must be a hexadecimal SHA' >&2; exit 1 ;;
          esac
          test "${#COMMIT_SHA}" -eq 40 || { echo 'commit_sha must be 40 characters' >&2; exit 1; }
      - name: Checkout immutable SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Validate the release without publishing
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
