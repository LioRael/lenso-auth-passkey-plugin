[workspace]
resolver = "2"
members = [
    "crates/lenso-auth-passkey-plugin",
    "crates/lenso-capability-passkey-auth",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-auth-passkey-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures = "0.3"
getrandom = "0.4"
lenso = "0.5.0"
lenso-auth-sdk = "0.2.1"
lenso-capability-credential-issuer = "0.2.0"
lenso-capability-identity-directory = "0.2.0"
lenso-capability-secrets = "0.1.2"
lenso-contract-authoring = "0.1.1"
lenso-contract-codegen = "=0.6.4"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-native-adapter = "0.3.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
uuid = { version = "1.19", features = ["serde", "v4"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
