[package]
name = "lenso-auth-passkey-plugin"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "PostgreSQL WebAuthn passkey Plugin for Lenso."

[package.metadata.lenso]
plugin-id = "lenso.auth.passkey"
root-slot = "auth-methods"

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true
lenso.workspace = true
lenso-auth-sdk.workspace = true
lenso-capability-credential-issuer.workspace = true
lenso-capability-identity-directory.workspace = true
lenso-capability-passkey-auth = { path = "../lenso-capability-passkey-auth", version = "0.1.1" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }

[lints]
workspace = true
